<text x="24" y="70" font-size="13.5" font-weight="500" fill="#1f2328">Ótima ideia de aplicativo e que funciona bem. […]</text><text x="24" y="90" font-size="13.5" font-weight="500" fill="#1f2328">Obrigada pelo APP e ótimo trabalho.</text><text x="24" y="114" font-size="11.5" font-style="italic" fill="#59636e">Great app idea, and it works well. […] Thanks for the app and</text><text x="24" y="130" font-size="11.5" font-style="italic" fill="#59636e">great work.</text>
