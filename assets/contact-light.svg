<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Let's build something. Open to Android, iOS and Kotlin Multiplatform roles.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f7f5"/><stop offset="0.55" stop-color="#e8f0fe"/><stop offset="1" stop-color="#f3ecff"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0.2" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="0.8" stop-color="#a78bfa"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<clipPath id="frame"><rect width="1280" height="250" rx="22"/></clipPath>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#101828" opacity="0.07"/></pattern>
<style>.orb{animation:drift 14s ease-in-out infinite alternate}@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-20px)}}@media (prefers-reduced-motion:reduce){.orb{animation:none}}</style></defs>
<g clip-path="url(#frame)"><rect width="1280" height="250" fill="url(#bg)"/>
<circle class="orb" cx="240" cy="230" r="170" fill="#2dd4bf" opacity="0.175" filter="url(#soft)"/>
<circle class="orb" cx="1040" cy="20" r="190" fill="#8b5cf6" opacity="0.21" filter="url(#soft)" style="animation-delay:-6s"/>
<rect width="1280" height="250" fill="url(#dots)"/>
<text x="640.0" y="112" font-size="58" font-weight="800" letter-spacing="-1.2" text-anchor="middle" fill="url(#name)">Let’s build something.</text>
<text x="640.0" y="160" font-size="23" font-weight="500" text-anchor="middle" fill="#101828">Open to Android, iOS and Kotlin Multiplatform roles</text>
<text x="640.0" y="196" font-size="17" text-anchor="middle" fill="#475467">Remote from Brasília, Brazil  ·  UTC-3</text></g></svg>